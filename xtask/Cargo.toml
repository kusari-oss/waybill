[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Milestone 669: cross-platform peak-RSS measurement for `xtask bench`.
# Dev-only per FR-015 + SC-009 (zero waybill-runtime dep additions).
sysinfo = "0.39.6"
# Milestone 669: JSON schema (baseline.json + run.json) round-trip.
# Dev-only.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Milestone 669: per-test scratch dirs for schema round-trip tests.
tempfile = "3"
