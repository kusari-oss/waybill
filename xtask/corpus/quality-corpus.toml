# Milestone 770 — SBOM quality regression corpus.
# Spec: specs/770-sbom-quality-corpus/spec.md   (issue #770)
#
# Consumed by `cargo run -p xtask --release -- quality`.
#
# HOW TO READ THIS FILE
#   Every target records what waybill actually produced at that pin, scanning
#   offline, measured 2026-09-04 with sbomqs v2.0.6. Bounds are authored
#   around those observations by hand.
#   An ABSENT key means "observe, never fail" (FR-020).
#   Ranges are INCLUSIVE at both ends.
#
# HOW THE BOUNDS WERE SIZED
#   pkgs / files / edges  +/-10% (minimum +/-3). These are fully deterministic:
#       pinned SHA + --offline + no sampling means the only thing that moves
#       them is a waybill change. Verified identical across two runs and
#       across sbomqs v2.0.5 and v2.0.6.
#   max_depth  -1 / +4. Asymmetric on purpose: a DEEPER graph is an
#       improvement and should not fail the job, but a collapse should.
#   sbomqs  +/-0.5. The whole corpus sits in a 5.81..7.70 band, so a
#       percentage band would be meaningless here. Scores were byte-identical
#       between sbomqs v2.0.5 and v2.0.6.
#   wall_ms  UPPER-BOUND GUARD ONLY, set at ~10x the observed value. Two runs
#       on identical hardware varied 0.78x-2.62x (ripgrep was the worst), and
#       CI runners are slower and noisier than the machine these were measured
#       on. These bounds catch a genuine collapse, not a slow morning. The
#       lower bound is a nominal floor -- "did it run at all" is already
#       covered far better by the pkgs bound.
#   flat  asserts the OBSERVED truth. Three targets are permanently flat
#       because their upstreams commit no lockfile; `flat = true` is the
#       correct assertion for them, not a defect being papered over.
#
# WHAT THESE NUMBERS ARE NOT
#   Scans run with --offline for reproducibility, so these measure waybill's
#   offline FLOOR. Improvements that only appear with network resolution are
#   invisible here. See research.md R2.

# Must match the version .github/workflows/ci.yml installs.
sbomqs_version = "v2.0.6"

# Per-target scan budget unless a target overrides it.
default_timeout_secs = 600


