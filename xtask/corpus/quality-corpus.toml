# Milestone 770 — SBOM quality regression corpus.
# Spec: specs/770-sbom-quality-corpus/spec.md   (issue #770)
#
# Consumed by `cargo run -p xtask --release -- quality`.
#
# HOW TO READ THIS FILE
#   Every target carries an `# Observed` comment recording what waybill
#   actually produced at that pin, scanning offline, on 2026-09-03. Those
#   are the numbers you author bounds around.
#
# HOW TO ADD A BOUND
#   Uncomment (or add) keys under a target's [targets.expect] table.
#   An ABSENT key means "observe, never fail" (FR-020) — which is why this
#   file ships with no bounds at all and still runs green.
#   Ranges are INCLUSIVE at both ends.
#
# AUTHORING GUIDANCE
#   sbomqs   — the whole corpus sits in a narrow 5.75..7.70 band. +/-0.5 is
#              meaningful; a percentage band is not.
#   wall_ms  — a single sample on shared hardware. Author order-of-magnitude
#              guards that catch a collapse, not tight perf assertions.
#   pkgs/files — they move for entirely different reasons. Bound separately.
#   flat     — `flat = true` is a legitimate assertion. Several upstreams
#              commit no lockfile and are permanently flat. Assert what is
#              true, not what you wish were true.
#
# WHAT THESE NUMBERS ARE NOT
#   Scans run with --offline for reproducibility, so these measure waybill's
#   offline FLOOR. Improvements that only appear with network resolution are
#   invisible here. See research.md R2.

# Must match the version .github/workflows/ci.yml installs.
sbomqs_version = "v2.0.6"

# Per-target scan budget unless a target overrides it.
default_timeout_secs = 600


