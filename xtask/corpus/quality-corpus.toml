#   wall=202ms sbomqs=7.59 pkgs=7 files=0 edges=7 depth=2 flat=false
#   waybill self-report: complete
[targets.expect]
pkgs      = { min = 4, max = 10 }
files     = { min = 0, max = 3 }
edges     = { min = 4, max = 10 }
max_depth = { min = 1, max = 6 }
sbomqs    = { min = 7.09, max = 8.09 }
wall_ms   = { min = 5, max = 3000 }
