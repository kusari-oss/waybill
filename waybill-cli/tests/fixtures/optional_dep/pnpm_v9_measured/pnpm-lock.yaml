# Milestone 1272 fixture — the shape pnpm v9 ACTUALLY produces.
#
# Captured from `pnpm install` on pnpm 12.16.1 via
# `specs/1272-npm-optional-scope/measurements/optional-axis-probe.sh`
# and `cancellation-probe.sh`, then rewritten with synthetic package
# names per FR-015. The STRUCTURE is measured; only the coordinates are
# invented, because a synthetic name cannot be installed from a registry.
#
# Three properties of the real shape that the pre-1272 sibling fixture
# (`../pnpm/pnpm-lock.yaml`) gets wrong, and that this milestone exists
# because of:
#
#   1. v9 keys are BARE -- `name@version`, no leading slash. The slash
#      form is v6/v7.
#   2. The `optional:` marker appears ONLY under `snapshots:`. A real v9
#      `packages:` entry has no such key, which is why the classifier's
#      old read of the packages entry always yielded false.
#   3. Peer-optionality is `peerDependenciesMeta.<name>.optional` on the
#      DECLARING PARENT. There is no `peer:` key anywhere in a real v9
#      lockfile.
#
# The four classification cases, all measured against npm and pnpm in
# `measurements/findings.md` Probe C:
#
#   runtime     declared under `dependencies`            -> NOT optional
#   optional    declared under `optionalDependencies`    -> optional
#   transitive  reachable only via an optional edge      -> optional
#   contested   declared optional AT THE ROOT and also reached
#               non-optionally via `runtime` -- Probe C's C1 case
#                                                        -> NOT optional
#   peerish     an optional PEER of the optional package -> NOT Optional
#               (m178 PROVIDED_DEPENDENCY_OF wins, FR-009)
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      waybill-fixture-runtime:
        specifier: 1.0.0
        version: 1.0.0
    optionalDependencies:
      waybill-fixture-optional:
        specifier: 2.0.0
        version: 2.0.0
      waybill-fixture-contested:
        specifier: 1.0.0
        version: 1.0.0

packages:

  waybill-fixture-runtime@1.0.0:
    resolution: {integrity: sha512-Zml4dHVyZXJ1bnRpbWUxMDAwZml4dHVyZXJ1bnRpbWUxMDAwZml4dHVyZXJ1bnRpbWUxMDAwZml4dHVyZXJ1bnRpbWUxMDAwZmk=}

  waybill-fixture-optional@2.0.0:
    resolution: {integrity: sha512-Zml4dHVyZW9wdGlvbmFsMjAwMGZpeHR1cmVvcHRpb25hbDIwMDBmaXh0dXJlb3B0aW9uYWwyMDAwZml4dHVyZW9wdGlvbmEx=}
    peerDependencies:
      waybill-fixture-peerish: '*'
    peerDependenciesMeta:
      waybill-fixture-peerish:
        optional: true

  waybill-fixture-transitive@3.0.0:
    resolution: {integrity: sha512-Zml4dHVyZXRyYW5zaXRpdmUzMDAwZml4dHVyZXRyYW5zaXRpdmUzMDAwZml4dHVyZXRyYW5zaXRpdmUzMDAwZml4dHVyZXQx=}

  waybill-fixture-contested@1.0.0:
    resolution: {integrity: sha512-Zml4dHVyZWNvbnRlc3RlZDEwMDBmaXh0dXJlY29udGVzdGVkMTAwMGZpeHR1cmVjb250ZXN0ZWQxMDAwZml4dHVyZWNvbnQx=}

  waybill-fixture-peerish@4.0.0:
    resolution: {integrity: sha512-Zml4dHVyZXBlZXJpc2g0MDAwZml4dHVyZXBlZXJpc2g0MDAwZml4dHVyZXBlZXJpc2g0MDAwZml4dHVyZXBlZXJpc2gx=}

snapshots:

  waybill-fixture-runtime@1.0.0:
    dependencies:
      waybill-fixture-contested: 1.0.0

  waybill-fixture-optional@2.0.0(waybill-fixture-peerish@4.0.0):
    dependencies:
      waybill-fixture-transitive: 3.0.0
      waybill-fixture-contested: 1.0.0
    optionalDependencies:
      waybill-fixture-peerish: 4.0.0
    optional: true

  waybill-fixture-transitive@3.0.0:
    optional: true

  waybill-fixture-contested@1.0.0: {}

  waybill-fixture-peerish@4.0.0:
    optional: true
