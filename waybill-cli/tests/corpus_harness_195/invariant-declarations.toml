# ---------------------------------------------------------------------
# I5 — a `complete` verdict over a document with unreachable
# components. #1207.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I5"
target = "pants-example-javascript"
kind = "complete-with-unreachable"
count_at_declaration = 1
reason = """
Same defect as the rust-ripgrep entry below and tracked by the same issue:
the completeness classifier excludes file-tier components as edgeless, so an
unreachable `pants_from_sources` script does not count against a `complete`
verdict.

Worth noting how this one was found, because it is the case for running the
matrix in both places. This target's golden is filtered to the `pkg:npm/*`
surface (feature 675 FR-008, to stay inside the goldens budget), and the
filter removes the file-tier component — so the golden's npm-only graph
really is complete and the hermetic matrix reports I5 as passing here. Only
the corpus lane, which evaluates the unfiltered emitted document, can see
it. A filtered golden is not a smaller truth; it is a different document.
"""
issue = 1207

[[declaration]]
invariant = "I5"
target = "rust-ripgrep"
kind = "complete-with-unreachable"
count_at_declaration = 7
reason = """
The document claims graph-completeness `complete` while carrying seven
file-tier components unreachable from the subject. #1207 is exactly this:
the completeness classifier excludes file-tier components as edgeless, so
they do not count against the verdict even when they are present and
unreachable. Either they get edges or the verdict stops saying `complete`.
"""
issue = 1207

# ---------------------------------------------------------------------
# I7 — components with no edge and no annotation explaining why.
#
# NOT one of #1206-#1211. This is a defect class the matrix surfaced on
# its first run: design-tier and toolchain components emitted by readers
# that post-date milestone 167's orphan-reason vocabulary and milestone
# 194's anchoring passes. Filed as #1214, which these rows now cite.
#
# #1214 is the largest of the classes the first run surfaced: every code
# in milestone 167's vocabulary is Go- or npm-specific by construction
# (`classify_orphans` short-circuits on any other ecosystem), so these
# cells want new vocabulary rather than a new caller of the old.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I7"
target = "go-opentelemetry"
kind = "unreachable-and-unexplained"
count_at_declaration = 1
reason = """
`pkg:pypi/codespell` comes from a requirements.txt in a Go repository's
tooling directory. It is a real declared dependency of the repo's lint
setup, has no edge to the Go subject, and carries no orphan-reason. Either
it is a build-tooling component and should say so, or the pip reader should
not attach it to this subject at all.
"""
issue = 1214

[[declaration]]
invariant = "I7"
target = "haskell-language-server"
kind = "unreachable-and-unexplained"
count_at_declaration = 2
reason = """
Two `pkg:generic/ghc-*@unspecified` toolchain components with no edge and no
orphan-reason. A compiler pin is build tooling, not a dependency of the
subject; it needs the marker that says so.
"""
issue = 1214

[[declaration]]
invariant = "I7"
target = "haskell-security-advisories"
kind = "unreachable-and-unexplained"
count_at_declaration = 3
reason = """
Three `pkg:github/*` flake inputs from flake.lock with no edge and no
orphan-reason. The milestone-925 lockfile reader emits flake inputs as
components but only wires edges between lockfile nodes, so an input that is
not itself depended on by another node ends up unexplained.
"""
issue = 1214

[[declaration]]
invariant = "I7"
target = "maven-guice"
kind = "unreachable-and-unexplained"
count_at_declaration = 5
reason = """
Five `pkg:bazel/*` components read from WORKSPACE, source-tier, with no edge
and no orphan-reason. guice builds with both Maven and Bazel; the bazel
reader emits archives it found but never relates them to the subject.
"""
issue = 1214

[[declaration]]
invariant = "I7"
target = "python-flask"
kind = "unreachable-and-unexplained"
count_at_declaration = 23
reason = """
Twenty-three uv.lock-resolved packages with no edge and no orphan-reason,
including a second `alabaster` at 0.7.16 alongside the reachable 1.0.0. These
are uv's alternate resolution forks: real entries in the lockfile that the
chosen resolution does not use. They need a marker saying so, or they read as
part of the artifact.
"""
issue = 1214

# ---------------------------------------------------------------------
# I8 — a component with no version and no annotation explaining why.
# Tracked by #1216. Two populations in one invariant: Pants resolve
# anchors, which are inherently versionless and need a marker saying so,
# and one Go binary whose version was never read. They are declared
# separately because the fixes are different and #1216 may close them in
# different changes.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I8"
target = "image-postgres16"
kind = "versionless-and-unexplained"
count_at_declaration = 1
reason = """
`pkg:generic/gosu?file-sha256=…` is a statically-linked, UNSTRIPPED Go ELF at
`usr/local/bin/gosu`, annotated `detected-go=true`, with no version and no
reason for not having one. Unlike the Pants rows below, this is a real
resolution gap rather than a labelling one: the Go build info that carries a
module version is plausibly present and unread, which is what milestone 129's
`.dep-v0` section reader exists for. The document cannot distinguish "read it
and found nothing" from "never looked".
"""
issue = 1216

[[declaration]]
invariant = "I8"
target = "pants-clojure-polyglot"
kind = "versionless-and-unexplained"
count_at_declaration = 4
reason = """
Four Pants resolve anchors — two jvm (`java17`, `java21`) and two python
(`pants-2.30`, `pants-2.31`). A resolve is a lockfile, not a package, so there
is no version to find; the data is right and only the document's account of
itself is incomplete. They carry `waybill:component-kind = lockfile-resolve`,
which I8 deliberately does not accept: it describes resolve ownership
(milestone 1064), not version absence, so a consumer still cannot tell an
anchor from a package whose resolution failed. See #1216 for why the fix is a
marker meaning "not versioned" rather than a wider accepted set here.
"""
issue = 1216

[[declaration]]
invariant = "I8"
target = "pants-example-django"
kind = "versionless-and-unexplained"
count_at_declaration = 1
reason = """
One Pants resolve anchor, `pkg:generic/python-default?pants-namespace=python`.
Same defect as pants-clojure-polyglot; kept as its own row so #1216's
per-target reach is readable from this file's diff.
"""
issue = 1216

[[declaration]]
invariant = "I8"
target = "pants-example-jvm"
kind = "versionless-and-unexplained"
count_at_declaration = 1
reason = """
One Pants resolve anchor, `pkg:generic/jvm-default?pants-namespace=jvm`. Same
