# Known-failure declarations for the invariant matrix — milestone 1155.
#
# This file holds NON-PASSING CELLS ONLY (FR-014b). A passing cell is
# implicit, so the file stays proportional to the number of outstanding
# defects rather than to the 8 x 17 cell count, and adding a corpus
# target does not rewrite unrelated entries.
#
# Sorted by (invariant, target), ascending. The sort is what keeps an
# unrelated change from moving an entry (FR-014c) — the line-stability
# requirement milestone 117 had to retrofit onto
# walk.audit-allowlist.txt after churn made its predecessor unusable.
#
# `kind` is PINNED: a different kind, or an additional kind, fails the
# lane. `count_at_declaration` is context only and never compared —
# counts drift for reasons unrelated to waybill, and a gate that reddens
# on innocent drift is the gate that gets switched off.
#
# WHEN A FIX LANDS, DELETE THE ENTRY IN THE SAME CHANGE. The lane fails
# on a stale declaration (FR-011) precisely so a fixed defect cannot keep
# its exemption.
#
# See specs/1155-invariant-major-corpus/contracts/declarations.md.

# ---------------------------------------------------------------------
# I1 — file-tier components on the receiving end of a dependsOn edge.
# Tracked by #1206. The orphan-anchoring pass (milestone 194 US1)
# anchors otherwise-unreachable components to the subject with a plain
# dependsOn; retyping to containment is a parity-model change across
# all three formats.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I1"
target = "image-postgres16"
kind = "file-tier-dependency-edge"
count_at_declaration = 117
reason = """
dpkg maintainer scripts are anchored to the image root by the milestone-194
US1 orphan-anchoring pass, which emits a plain dependsOn. An image does not
depend on a maintainer script; the edge should be containment. Retyping it
is a parity-model change across CycloneDX, SPDX 2.3 and SPDX 3.
"""
issue = 1206

[[declaration]]
invariant = "I1"
target = "pants-example-django"
kind = "file-tier-dependency-edge"
count_at_declaration = 1
reason = """
Same defect as image-postgres16, one anchored file rather than 117. Kept as
its own row so the fix's per-target reach is readable from this file's diff:
#1206 landing should remove all four I1 entries, and any it leaves behind is
the visible record of a gap.
"""
issue = 1206

[[declaration]]
invariant = "I1"
target = "pants-example-jvm"
kind = "file-tier-dependency-edge"
count_at_declaration = 1
reason = """
Same defect as image-postgres16; see the pants-example-django entry for why
each target carries its own row.
"""
issue = 1206

[[declaration]]
invariant = "I1"
target = "pants-example-python"
kind = "file-tier-dependency-edge"
count_at_declaration = 1
reason = """
Same defect as image-postgres16; see the pants-example-django entry for why
each target carries its own row.
"""
issue = 1206

# ---------------------------------------------------------------------
# I2 — same-basename file components sharing one identity. #1208.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I2"
target = "maven-guice"
kind = "duplicate-file-identity"
count_at_declaration = 1
reason = """
Seven file-tier components are all named `pom.xml` with an empty version, so
`(name, version, type)` identifies all seven at once. This is #1208's defect
with a different basename: the file-tier identity needs to carry enough of
the path to be distinguishing. The seven are distinct files in distinct
modules, so the SBOM is not wrong about what it saw — only about which is
which.
"""
issue = 1208

