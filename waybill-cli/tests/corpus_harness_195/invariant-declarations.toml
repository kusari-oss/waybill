# ---------------------------------------------------------------------
# I3 — non-runtime scope is not propagated transitively.
#
# All five declarations that once stood here are gone. Four were
# deleted by milestone 1269, which added the emit-time propagation pass
# #1209 asked for. The fifth, `rust-ripgrep`, was deleted by #1272, and
# the two causes are worth keeping apart because telling them apart
# took running each fix.
#
# `waybill:lifecycle-scope` is emitted only for non-runtime scopes, so
# a component the reader scoped `Runtime` and a component with no scope
# at all are byte-identical in the emitted document. All 101 violators
# across the five targets read as "no scope property" in their
# goldens. Only the in-memory state separates them, which is why the
# split was invisible to the analysis that wrote the five entries as
# one class — and why this entry's recorded reason named the wrong
# component for as long as it stood. It said `serde_json` was not
# activated and its transitives `ryu` and `itoa` wrongly `Runtime`.
# Measured against ripgrep's manifests the opposite held: `serde_json`
# is a plain non-optional dependency of the workspace root and is
# additionally activated by `crates/printer`'s default features, so it
# ships, its transitives were right, and `serde_json` itself was the
# component carrying the wrong scope.
#
# The cell is no longer applicable rather than merely passing:
# ripgrep's document now declares no non-runtime dependency edges at
# all, because without feature-activation evidence waybill declines to
# call a cargo dependency optional and the corpus lane scans
# `--offline`. I3 is still exercised by `python-flask` and
# `nix-closure-moat`. That the only cargo target no longer exercises it
# is a consequence of #1272 and an argument for #1284.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# I5 — a `complete` verdict over a document with unreachable
# components. #1207.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I5"
target = "pants-example-javascript"
kind = "complete-with-unreachable"
count_at_declaration = 1
reason = """
Same defect as the rust-ripgrep entry below and tracked by the same issue:
the completeness classifier excludes file-tier components as edgeless, so an
unreachable `pants_from_sources` script does not count against a `complete`
verdict.

Worth noting how this one was found, because it is the case for running the
matrix in both places. This target's golden is filtered to the `pkg:npm/*`
surface (feature 675 FR-008, to stay inside the goldens budget), and the
filter removes the file-tier component — so the golden's npm-only graph
really is complete and the hermetic matrix reports I5 as passing here. Only
the corpus lane, which evaluates the unfiltered emitted document, can see
it. A filtered golden is not a smaller truth; it is a different document.
"""
issue = 1207

[[declaration]]
invariant = "I5"
target = "rust-ripgrep"
kind = "complete-with-unreachable"
count_at_declaration = 7
reason = """
The document claims graph-completeness `complete` while carrying seven
file-tier components unreachable from the subject. #1207 is exactly this:
the completeness classifier excludes file-tier components as edgeless, so
they do not count against the verdict even when they are present and
unreachable. Either they get edges or the verdict stops saying `complete`.
"""
issue = 1207

# ---------------------------------------------------------------------
# I7 — components with no edge and no annotation explaining why.
#
# NOT one of #1206-#1211. This is a defect class the matrix surfaced on
# its first run: design-tier and toolchain components emitted by readers
# that post-date milestone 167's orphan-reason vocabulary and milestone
# 194's anchoring passes. Filed as #1214, which these rows now cite.
#
# #1214 is the largest of the classes the first run surfaced: every code
# in milestone 167's vocabulary is Go- or npm-specific by construction
# (`classify_orphans` short-circuits on any other ecosystem), so these
# cells want new vocabulary rather than a new caller of the old.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I7"
target = "haskell-security-advisories"
kind = "unreachable-and-unexplained"
count_at_declaration = 3
reason = """
Three `pkg:github/*` flake inputs with no edge and no orphan-reason.
Feature 1218 added an `unreferenced-lock-node` code for exactly this
population and it cannot reach them: `nix::attach_inputs_to_projects`
adds main-module-to-root-input RELATIONSHIPS, so the emit-time
classifier's BFS sees these as reachable and skips them, while the
emitted `dependencies[]` carries no such edge and invariant I7 — which
reads the document — sees them as unreachable. The classifier and the
document disagree about reachability, which is a waybill defect rather
than a missing word, so the cell keeps reporting it.
"""
issue = 1237

[[declaration]]
invariant = "I7"
target = "maven-guice"
kind = "unreachable-and-unexplained"
count_at_declaration = 3
reason = """
Three `pkg:maven/*` components with no edge and no orphan-reason. The
maven dual-key insert emits BOTH the coordinate a submodule declared
and the version the workspace resolved, and wires only the resolved
one: `examples/guice-demo/pom.xml` asks for `guice@5.1.0`, the edge
points at `guice@7.0.0`, and the 5.1.0 component is left unreferenced.
One coordinate, two components, the one a consumer would look up being
the orphan. A duplicate-identity defect, not an explanation gap.
Feature 1218 explained the two `pkg:bazel/*` WORKSPACE components that
shared this cell and deliberately left these.
"""
issue = 1235

[[declaration]]
invariant = "I7"
target = "python-flask"
kind = "unreachable-and-unexplained"
count_at_declaration = 13
reason = """
Thirteen `examples/celery/requirements.txt` components with no edge
and no orphan-reason. The `requirements.txt` path emits components with
ZERO out-edges, so the member main module is wired to `celery` and the
whole transitive closure below it dangles — the edges are in the
lockfile, the emitter never wrote them. A missing edge, not a missing
explanation: a marker here would record a waybill defect as a property
of the flask repository and close the cell reporting it. Feature 1218
explained the ten `uv.lock` resolution forks that shared this cell and
deliberately left these.
"""
issue = 1234

# ---------------------------------------------------------------------
# I8 — a component with no version and no annotation explaining why.
#
# Tracked by #1216, which had two populations in one invariant. The
# first — Pants resolve anchors, inherently versionless — is CLOSED:
# milestone 1156 gave them `waybill:version-absence = by-construction`
# (C197) and the four declarations that stood here are gone. Those four
# cells are now held by a named-target positive control,
# `mutation_tests::i8_applies_and_passes_on_each_named_pants_target`,
# because `Pass` and `NotApplicable` both pass the lane and only the
# first is what the fix achieved.
#
# What remains is the second population: one Go binary whose version is
# read and then discarded. It is a resolution gap rather than a labelling
# one, which is why the two were declared separately and why one closed
# without the other.
# ---------------------------------------------------------------------

[[declaration]]
invariant = "I8"
target = "image-postgres16"
kind = "versionless-and-unexplained"
count_at_declaration = 1
reason = """
`pkg:generic/gosu?file-sha256=…` is a statically-linked, UNSTRIPPED Go ELF at
`usr/local/bin/gosu`, annotated `detected-go=true`, with no version and no
reason for not having one. Unlike the Pants population this invariant used to
also hold, this is a real resolution gap rather than a labelling one.

The version is read and then discarded, which is not what this row first
said. `go version -m` on the binary reports `mod github.com/tianon/gosu
v1.19.0`, and waybill's own BuildInfo reader parses it: the scan logs
`extracted Go binary BuildInfo components … entries=4 main_modules=1`, then
`G5 filter: dropped main-module self-references dropped=1`, leaving three
golang components. The entry deleted is the one carrying the version.

The mechanism is the milestone-053 FR-009 main-module filter at
`scan_fs/package_db/mod.rs:926`: for a name in `main_modules` it retains only
an entry tagged `waybill:component-role = main-module`, which is built from a
`go.mod`. `gosu` in the image has no source tree, so the tagged counterpart
was never created and the dedup drops the only carrier of the module
identity. A reproduction that needs no container image is inlined in #1216.
"""
issue = 1216

