# Waybill's curated CPE table (spec 1491, #1491).
#
# Each row maps a `pkg:generic/<slug>` component to the NVD vendor and
# product pairs a CPE matcher keys on. The slug is the lowercase name the
# version-string scanner, the symbol-fingerprint matcher and the Nix closure
# tier give the component. The first pair is the primary CPE; the rest are
# secondary candidates. The CPE's version is the component's own.
#
# Rules, enforced by the tests in `generate/cpe.rs` and `generate/cpe_table.rs`:
# - rows are sorted by `key`, and no key repeats;
# - every pair forms a valid CPE 2.3 name;
# - every pair carries the NVD CPE-dictionary entry count observed for it,
#   the date of that observation, and two evidence files committed under
#   `specs/`: `dictionary_evidence`, which records that count, and
#   `title_evidence`, which records the `=== <product> (` title query showing
#   the pair names this software and not a namesake;
# - the file holds identifiers and their dictionary evidence only. It never
#   holds vulnerability data; that is the scanner's, keyed on these CPEs.
#
# A row is added only once the pair has been probed
# (`scripts/probe-cpe-dictionary.sh`) and its titles read. A wrong vendor or
# product fails silently: the matcher finds nothing, which looks the same as
# a clean component. Upstream has shipped exactly that (anchore/syft#4788
# derived `expat:expat` where NVD uses `libexpat`).
#
# Every pair was found by querying NVD with the vendor wildcarded and reading
# what came back, never by assuming the vendor equals the package name. It
# usually does not: `bash` is `gnu`, `libxml2` is `xmlsoft`, `expat` is
# `libexpat_project`. Titles decided the rows, not entry counts; see
# `specs/1375-generic-cpe-table/research.md` R4 for the dispositions, and the
# rejected names recorded in `generate/cpe.rs`.
#
# Multi-vendor rows list first the vendor NVD's records cite most (#1490;
# `specs/1375-generic-cpe-table/measurements/nvd-vendor-cves-2026-11-13.tsv`),
# so a consumer reading one CPE reads the primary.
#
# An operator's `--cpe-map` file uses this schema, keyed by any versionless
# PURL, with the evidence fields optional.

[[row]]
key = "pkg:generic/automake"
pair = [
  { vendor = "gnu", product = "automake", dictionary_entries = 51, observed = "2026-11-13", dictionary_evidence = "specs/1375-generic-cpe-table/measurements/nvd-vendor-cves-2026-11-13.tsv", title_evidence = "specs/1375-generic-cpe-table/measurements/nvd-titles.txt" },
]

