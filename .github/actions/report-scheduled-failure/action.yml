name: 'Report scheduled-run failure'
description: >-
  Open (or append a comment to) a deduped GitHub issue when a scheduled
  workflow fails. Issue #859 — the escalation half of a nightly check.

# Issue #859. Detection was never the problem in this repo: the nightly
# public-corpus lane fired correctly 51 nights running and failed all 51
# times while the goldens rotted. Every one of those failures landed as a
# red square in the Actions tab that nobody opened.
#
# `.github/workflows/ebpf-canary.yml` has always escalated, which is why
# #685 stayed visible while the corpus rot did not — same repo, same
# nightly hour, opposite outcome, and the entire difference was one step
# in a YAML file. This action is that step, factored out so the next
# nightly lane inherits it instead of re-deriving it.
#
# Dedupe is by EXACT title. N nightly failures become one issue plus N
# comments, never N issues. That makes the comment count the staleness
# metric: "red for 51 nights" is then visible at a glance instead of
# requiring someone to page back through the Actions tab.

inputs:
  title:
    description: >-
      Issue title. This is the dedupe key and is matched exactly — changing
      it for an existing lane orphans the open issue and starts a new one.
    required: true
  labels:
    description: 'Comma-separated labels applied on create and used to scope the dedupe lookup.'
    required: true
  triage:
    description: >-
      Markdown appended to the issue body on FIRST open only: what this lane
      guards, and what to do about a failure. Not repeated per comment.
    required: false
    default: ''
  detail:
    description: >-
      Per-run failure detail (target names, violated metrics, drifted
      formats). Appended to every comment. Blank falls back to a log link.
    required: false
    default: ''
  token:
    description: 'Token with issues:write.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    # Labels are created idempotently so a caller can adopt a new label
    # without a separate repo-settings change. An existing label keeps its
    # own colour and description — `gh label create` fails on a duplicate
    # and the `|| true` swallows exactly that case.
    - name: Ensure labels exist
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LABELS: ${{ inputs.labels }}
      run: |
        set -euo pipefail
        echo "$LABELS" | tr ',' '\n' | while read -r label; do
          label="$(echo "$label" | xargs)"
          [ -z "$label" ] && continue
          gh label create "$label" \
            --color EDEDED \
            --description "Auto-applied by a scheduled-failure report (#859)" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
        done

    - name: Open or update the tracking issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.token }}
        # Inputs reach the script through process.env rather than being
        # interpolated into the JS source, so a failure detail containing
        # backticks or `${}` cannot terminate a template literal and run as
        # code. Defence in depth: `detail` is derived from build logs, which
        # for the corpus lanes include third-party repository content.
        script: |
          const title  = process.env.ISSUE_TITLE;
          const labels = process.env.ISSUE_LABELS.split(',').map(s => s.trim()).filter(Boolean);
          const triage = (process.env.ISSUE_TRIAGE || '').trim();
          const detail = (process.env.ISSUE_DETAIL || '').trim();

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const timestamp = new Date().toISOString();

          // A caller that cannot cheaply extract its own failure detail --
          // a matrix job, where per-job outputs collide and only one
          // survives -- gets this instead: the failed jobs of this run and
          // the step that failed inside each. Enough to know WHICH arm of a
          // matrix broke without opening the run.
          async function failedStepsFallback() {
            try {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100 },
              );
              const lines = [];
              for (const job of jobs) {
                if (job.conclusion !== 'failure') continue;
                lines.push(`${job.name}: ${job.conclusion}`);
                for (const step of job.steps || []) {
                  if (step.conclusion === 'failure') lines.push(`  failed step: ${step.name}`);
                }
              }
              return lines.join('\n');
            } catch (err) {
              core.warning(`could not enumerate failed jobs: ${err.message}`);
              return '';
            }
          }

          const body = detail || await failedStepsFallback();

          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: labels.join(','),
            per_page: 100,
          });
          const match = existing.data.find(i => i.title === title);

          // Night 1 is the issue body itself, so the Nth failure carries
          // comment_count + 1. Stating it outright means nobody has to
          // count comments to see how long this has been red — that count
          // going unread for seven weeks is what #859 was filed about.
          const night = match ? match.comments + 1 : 1;

          const commentBody = [
            `## Failure ${night} — ${timestamp}`,
            ``,
            body ? `\`\`\`\n${body}\n\`\`\`` : `_No detail extracted — see the run log._`,
            ``,
            `Run: ${runUrl}`,
            ``,
            night >= 7
              ? `> **${night} consecutive scheduled failures.** This lane has been red for a week or more.`
              : ``,
          ].join('\n');

          if (match) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: commentBody,
            });
            core.notice(`Appended failure ${night} to issue #${match.number}: ${match.html_url}`);
            return;
          }

          const issueBody = [
            triage,
            ``,
            `## Staleness`,
            ``,
            `This issue is deduped by exact title, so each scheduled failure`,
            `appends a comment rather than opening a new issue. **The comment`,
            `count is the staleness metric** — it is how many consecutive runs`,
            `this has been red.`,
            ``,
            `Close it once the lane is green again; the next failure reopens a`,
            `fresh one and the count restarts.`,
            ``,
            `---`,
            `_Auto-opened per [#859](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/859)._`,
            `_Dedupe is by exact title — do not edit the title._`,
            ``,
            commentBody,
          ].join('\n');

          const created = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body: issueBody,
            labels,
          });
          core.notice(`Opened issue #${created.data.number}: ${created.data.html_url}`);
      env:
        ISSUE_TITLE: ${{ inputs.title }}
        ISSUE_LABELS: ${{ inputs.labels }}
        ISSUE_TRIAGE: ${{ inputs.triage }}
        ISSUE_DETAIL: ${{ inputs.detail }}
