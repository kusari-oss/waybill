name: Public corpus regression

# Milestone 195 — Public SBOM Regression Corpus.
# Nightly UTC schedule + manual dispatch on any branch per spec Q2
# clarification. Never runs on the default per-PR lane (default lane
# is `ci.yml`; corpus wall-clock ~30 min cold-cache violates SC-004).

on:
  schedule:
    # Nightly at 06:17 UTC (offset from top-of-hour per project_ci_timing).
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the corpus against (defaults to main).'
        type: string
        default: main
      regen_goldens:
        description: 'Regenerate public-corpus goldens in-place (writes to fixtures/, uploads as artifact).'
        type: boolean
        default: false

concurrency:
  group: public-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus:
    name: Run public corpus (${{ github.event.inputs.branch || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45   # SC-005: cold-cache < 30 min; 15-min buffer
    outputs:
      # Consumed by the `report-failure` job so the auto-opened issue
      # names what broke instead of only linking a run.
      failing: ${{ steps.extract.outputs.failing }}
    permissions:
      # This job only reads sources and uploads artifacts — no writes to
      # the repo, no package publishing, no PR-comment mutation. Locked
      # down to minimum per Kusari Inspector guidance.
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0
          # Do NOT leave GITHUB_TOKEN persisted in git config — the
          # emitted-SBOM artifact upload on failure could otherwise
          # exfiltrate the token via .git/config leakage.
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-25)
        with:
          toolchain: "1.98.1"

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: public-corpus

      - name: Build waybill (release)
        run: cargo build --release -p waybill --bin waybill

      - name: Run public corpus
        env:
          WAYBILL_RUN_PUBLIC_CORPUS: '1'
          # m196: conditional regen mode. When the maintainer dispatches
          # with `regen_goldens=true`, the m195 harness writes goldens
          # instead of comparing (see layer2_golden::compare_golden).
          # Nightly cron never sets this — remains empty string = verify mode.
          WAYBILL_UPDATE_PUBLIC_CORPUS_GOLDENS: ${{ inputs.regen_goldens == true && '1' || '' }}
        run: |
          set -o pipefail
          mkdir -p corpus-artifacts
          # --include-ignored: the corpus targets are #[ignore]d so a local
          # `cargo test` reports them as ignored rather than as passing
          # tests that silently skipped (#918). CI opts back in.
          cargo test --test public_corpus --release -- --nocapture --include-ignored --test-threads=3 \
            2>&1 | tee corpus-artifacts/corpus-run.log

      # #918 — refuse to report success having compared nothing.
      #
      # The corpus targets are `#[ignore]`d so a local `cargo test` cannot
      # report them as passing when they silently skipped. That moves the
      # hazard rather than removing it: if `--include-ignored` above is ever
      # dropped, or the workflow file and the test file drift apart, every
      # target is skipped and the lane goes GREEN having verified nothing —
      # a false green, which is strictly worse than the red it replaces.
      #
      # This is not hypothetical. It happened on run 35403388053, dispatched
      # while the workflow file still came from main and the checkout came
      # from the branch: 11 targets ignored, lane green.
      #
      # So: assert that targets actually ran, and that the count matches the
      # gating set. A number, not a boolean — "some ran" would not catch a
      # target being quietly dropped from TARGETS.
      - name: Assert the corpus actually ran
        if: always()
        run: |
          set -euo pipefail
          log=corpus-artifacts/corpus-run.log
          ran=$(grep -cE '^test corpus_[a-z0-9_]+ \.\.\. (ok|FAILED)' "$log" || true)
          ignored=$(grep -cE '^test corpus_[a-z0-9_]+ \.\.\. ignored' "$log" || true)
          echo "corpus targets: ran=$ran ignored=$ignored"
          if [ "$ran" -eq 0 ]; then
            echo "::error::The corpus lane compared ZERO targets ($ignored ignored). That is a false green: --include-ignored is missing, or the workflow file and the test file have drifted. Failing rather than reporting success. See #918."
            exit 1
          fi
          if [ "$ignored" -ne 0 ]; then
            echo "::warning::$ignored corpus target(s) were ignored rather than run."
          fi

      # Extract which targets drifted and in how many formats. The
      # per-format count matters for triage: "3 of 3" reads as broad
      # accumulated drift, while a single format drifting is narrower and
      # more suspicious. That line exists because milestone 840 made the
      # lane report every format rather than stopping at the first.
      - name: Extract failing targets
        id: extract
        if: always()
        run: |
          set -euo pipefail
          log=corpus-artifacts/corpus-run.log
          [ -f "$log" ] || { echo "failing=" >> "$GITHUB_OUTPUT"; exit 0; }
          {
            # `|| true` per pipeline, not just on the group: under
            # `set -e` a non-matching grep aborts the whole group, so a
            # miss on the first pattern would silently skip the second.
            grep -oE 'test corpus_[a-z0-9_]+ \.\.\. FAILED' "$log" \
              | sed -E 's/test (corpus_[a-z0-9_]+) \.\.\. FAILED/- \1/' | sort -u || true
            grep -oE '[0-9]+ of 3 formats drifted for [a-z0-9_-]+' "$log" \
              | sed -E 's/^/  - /' | sort -u || true
          } > corpus-artifacts/failing.txt || true
          {
            echo 'failing<<CORPUS_EOF'
            cat corpus-artifacts/failing.txt
            echo 'CORPUS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Capture summary
        if: always()
        env:
          # Route user-controllable inputs through env vars so they
          # can't be evaluated as shell code inside the run: block
          # (per Kusari Inspector template-injection finding).
          BRANCH_REF: ${{ github.event.inputs.branch || github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p corpus-artifacts
          {
            echo "# Public corpus run — ${BRANCH_REF}"
            echo ""
            echo "Commit: ${COMMIT_SHA}"
            echo "Date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "See workflow log for per-target diagnostic blocks."
            if [ -s corpus-artifacts/failing.txt ]; then
              echo ""
              echo "## Drifted"
              echo ""
              cat corpus-artifacts/failing.txt
            fi
          } > corpus-artifacts/corpus-run-summary.md

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-run-summary
          path: corpus-artifacts/corpus-run-summary.md
          retention-days: 30

      - name: Upload emitted SBOMs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-emitted-sboms
          # Cache layout per m195 cache.rs is
          # `~/.cache/waybill/corpus/<source-id>/<pin>/{repo/emitted,emitted}/*.json`
          # — depth varies (git targets nest under `repo/`, OCI targets don't).
          # `**` handles both cases.
          # `*.json*` — NOT `*.json`. The harness writes the MASKED
          # `<target>.<fmt>.json.actual` beside the raw emission, and the
          # masked file is the one the comparison actually used and the one
          # the failure message tells you to diff. `*.json` silently excluded
          # it, so every failure artifact shipped the raw emission while the
          # committed golden is masked: diffing them showed the masking, not
          # the drift. That made the documented "read the diffs before
          # regenerating" procedure impossible to execute, leaving
          # regen-and-eyeball as the only workable path — which is how a real
          # regression gets encoded as expected output. See #918.
          path: ~/.cache/waybill/corpus/**/emitted/*.json*
          if-no-files-found: warn
          retention-days: 14

      # m196: upload the regenerated goldens as an artifact when the
      # maintainer dispatched with `regen_goldens=true`. Regardless of
      # pass/fail — regen mode writes goldens on Layer 1 pass; Layer 1
      # failures still surface useful state via the emitted-SBOMs
      # artifact above.
      - name: Upload regenerated goldens
        if: ${{ inputs.regen_goldens == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-goldens-regen
          path: waybill-cli/tests/fixtures/public_corpus/
          if-no-files-found: warn
          retention-days: 14

  # Issue #859 — escalation. Detection was never the problem: this lane
  # ran nightly and failed 51 consecutive times (2026-07-24 to
  # 2026-09-12) while the goldens rotted, and every one of those failures
  # landed as a red square in the Actions tab that nobody opened.
  #
  # Modelled on `.github/workflows/ebpf-canary.yml`, which has always
  # done this and is why #685 was visible while the corpus rot was not.
  # Same repo, same nightly hour, opposite outcome — the difference was
  # one step in a YAML file.
  report-failure:
    name: Report corpus failure
    needs: corpus
    # Scheduled runs ONLY. Manual dispatches with regen_goldens=true are
    # expected to fail mid-refresh — several did during #858 — and
    # opening an issue for each would drown the signal inside a week.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/report-scheduled-failure
        with:
          # Unchanged from the inline implementation this replaced. The
          # title is the dedupe key and is matched exactly, so editing it
          # would orphan any open corpus issue and restart the count.
          title: '[canary] public-corpus goldens are drifting'
          labels: 'canary,corpus'
          detail: ${{ needs.corpus.outputs.failing }}
          triage: |
            The nightly public-corpus lane is failing. Either the goldens
            have accumulated drift and need refreshing, or something
            regressed.

            **Refresh procedure:** [`docs/development/refreshing-corpus-goldens.md`](https://github.com/kusari-oss/waybill/blob/main/docs/development/refreshing-corpus-goldens.md)

            Read the diffs before regenerating. If a target is failing for a
            reason other than accumulated drift, regenerating its golden
            encodes the fault as expected output.

            ## Reading the per-format count

            - `3 of 3 formats drifted` — broad accumulated drift, usually benign
            - a single format drifting — narrower, and more suspicious
