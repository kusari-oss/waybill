name: Performance benchmarks

# Wall-clock perf tests (triple_format_perf.rs, dual_format_perf.rs) are
# marked #[ignore] in the default lane to avoid blocking PRs on
# shared-CI-runner timing noise. This workflow runs them on demand
# (perf label or workflow_dispatch) and on a daily schedule against
# main. 3-attempt retry per test absorbs runner-noise spikes.
#
# NOT required for PR merge. Default-lane structural-correctness
# coverage lives in waybill-cli/tests/triple_format_structural.rs.
#
# See specs/094-deflake-perf-tests/ for the full rationale.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily — off-peak for both NA and EU

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  perf:
    name: Wall-clock perf benchmarks
    # Gate the pull_request trigger to fire only on the `perf` label.
    # workflow_dispatch + schedule always pass this check.
    if: github.event_name != 'pull_request' || github.event.label.name == 'perf'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-25)
        with:
          # Must match `channel` in rust-toolchain.toml. Without this the action
          # installs `stable`, then rustup auto-installs the pinned toolchain on
          # the first cargo call -- two downloads per job. Measured on PR #944:
          # +2m18s linux, +5m43s macOS, +6m03s windows.
          toolchain: "1.98.1"

      - name: Cache cargo + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: perf-${{ matrix.runner }}

      # See ci.yml::lint-and-test for the rationale. MUST run AFTER
      # Swatinem/rust-cache or its $CARGO_HOME/bin restore re-creates
      # rustup-init.
      - name: Remove rustup-init (prevents `cargo +stable` dispatch race)
        shell: bash
        run: |
          rm -f "$HOME/.cargo/bin/rustup-init" "$HOME/.cargo/bin/rustup-init.exe"
          if ! cargo --version > /dev/null 2>&1; then
            echo "ERROR: \`cargo --version\` fails — \$HOME/.cargo/bin/cargo is not a working cargo proxy."
            echo "--- ls -la \$HOME/.cargo/bin/ ---"
            ls -la "$HOME/.cargo/bin/" || true
            echo "--- file \$HOME/.cargo/bin/cargo ---"
            file "$HOME/.cargo/bin/cargo" || true
            echo "--- cargo --version output ---"
            cargo --version 2>&1 || true
            exit 1
          fi
          echo "cargo --version OK: $(cargo --version)"
          if [ -e "$HOME/.cargo/bin/rustup-init" ] || [ -e "$HOME/.cargo/bin/rustup-init.exe" ]; then
            echo "ERROR: rustup-init still present after rm."
            ls -la "$HOME/.cargo/bin/" || true
            exit 1
          fi
          echo "rustup-init absent from \$HOME/.cargo/bin (good)."

      - name: Run triple_format_perf (with retry)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: cargo +stable test --workspace -- --ignored --test-threads=1 triple_format_is_at_least_25_percent_faster_than_three_sequential_scans

      - name: Run dual_format_perf (with retry)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: cargo +stable test --workspace -- --ignored --test-threads=1 dual_format_is_at_least_30_percent_faster_than_two_sequential_scans

  # Issue #859 sweep. Green for all 21 scheduled runs on record, so this
  # escalation is latent rather than overdue — which is the point of doing
  # it now rather than after the lane has been red for a month.
  report-failure:
    name: Report perf failure
    needs: perf
    # Scheduled runs only. A `perf`-labelled PR run and a manual dispatch
    # both have a human already watching; a 06:00 UTC cron does not.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `detail:` here on purpose. `perf` is a matrix and its two arms
      # would write the same job output, so only one would survive; the
      # action's fallback names the failed arm and step from the API
      # instead, which is the part that matters — ubuntu and macos fail for
      # different reasons.
      - uses: ./.github/actions/report-scheduled-failure
        with:
          title: '[canary] nightly perf benchmarks are failing'
          labels: 'canary,perf'
          triage: |
            The nightly wall-clock perf lane is failing on at least one
            runner. These tests are `#[ignore]`d in the default lane and are
            NOT required for merge — a failure here blocks nothing, which is
            precisely why it needs to announce itself.

            **Spec:** `specs/094-deflake-perf-tests/`
            **Methodology:** [`docs/development/perf-methodology.md`](https://github.com/kusari-oss/waybill/blob/main/docs/development/perf-methodology.md)

            ## Triage

            Each test already retries 3× via `nick-fields/retry`, so a
            failure here is three consecutive misses, not one unlucky
            sample. Treat it as signal, not noise.

            Check which runner failed before anything else — `macos-latest`
            alone is usually shared-runner contention, while both arms
            failing together points at the ratio the test asserts having
            genuinely moved.

            These are *ratio* assertions (triple-format ≥25% faster than
            three sequential scans; dual-format ≥30% faster than two). A
            ratio can regress because the fast path got slower **or**
            because the baseline path got faster. Confirm which before
            hunting for a slowdown that may not exist.
