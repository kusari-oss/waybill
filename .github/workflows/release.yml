name: Release

on:
  push:
    tags:
      # Feature 229 (release-flow implementation) expanded this list from
      # the pre-229 3-pattern set to cover the new two-channel model:
      #   - stable channel: bare-SemVer `v<X>.<Y>.<Z>` (v0.2.0+)
      #   - nightly channel: `v<X>.<Y>.<Z>-nightly.YYYYMMDD` (m229 US2)
      #   - bridge pre-releases (Q3 always-acceptable): -alpha.*, -beta.*,
      #     -rc.*, -preview.* — retiring `alpha.N` sequence still supported
      #     for emergency bridges via `v0.1.0-alpha.71`+ tags.
      - 'v*-alpha.*'       # bridge alphas (Q3 always-acceptable)
      - 'v*-beta.*'        # future beta channel + bridge betas
      - 'v*-rc.*'          # bridge RCs (Q3 always-acceptable)
      - 'v*-nightly.*'     # 229 US2 nightly channel
      - 'v*-preview.*'     # 229 Q3 bridge with -preview suffix
      - 'v[0-9]+.[0-9]+.[0-9]+'  # 229 US1 stable channel (bare SemVer, no suffix)
  # Manual escape hatch (issue #171). Lets a maintainer kick off a
  # release against an existing tag without a workstation
  # `git push origin v*-alpha.*` — useful when an existing tag's
  # workflow run was cancelled mid-flight, when re-cutting a partial
  # release, or when the `auto-tag-release.yml` worker pushed a tag
  # via GITHUB_TOKEN (which by design does NOT trigger downstream
  # workflows — see auto-tag-release.yml's explanatory comment).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0-alpha.47). Must already exist on the repo.'
        required: true
        type: string
      skip_ebpf:
        description: 'Skip the eBPF build entirely (emit userspace-only tarballs). Emergency escape hatch when the bpf-linker install regresses (e.g. LLVM path drift on ubuntu-latest). Produced tarballs have `waybill sbom scan` etc. but NO `waybill trace` mode. Default false.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single source of truth for the tag-name string used throughout
  # the workflow. `inputs.tag` is set only on workflow_dispatch;
  # `github.ref_name` is set on the push-tags path and falls through
  # to the auto-trigger case.
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  # Build the target-independent bpfel-unknown-none bytecode once and share
  # it with both Linux userspace-build jobs via artifact upload.
  build-ebpf:
    name: Build eBPF object
    # Skip the eBPF build entirely when the operator sets
    # workflow_dispatch input `skip_ebpf=true`. Emergency escape hatch
    # for the bpf-linker install regression documented at:
    # https://github.com/aya-rs/bpf-linker/issues (LLVM path drift on
    # ubuntu-latest). Downstream Linux userspace jobs treat this job's
    # non-success as a signal to package a userspace-only tarball.
    if: ${{ !inputs.skip_ebpf }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install eBPF build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev pkg-config

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly (2026-04-25)
        with:
          components: rust-src

      - name: Cache cargo + nightly build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ebpf-nightly
          workspaces: |
            .
            waybill-ebpf

      # See ci.yml::lint-and-test for the rationale — dtolnay/rust-
      # toolchain leaves `rustup-init` on PATH alongside the real
      # `rustup`/`cargo`, and cargo's `+<channel>` dispatch can route
      # to `rustup-init` non-deterministically, producing the
      # `unexpected argument '+stable' found` flake on any runner.
      # MUST run AFTER Swatinem/rust-cache or its $CARGO_HOME/bin
      # restore re-creates rustup-init.
      - name: Remove rustup-init (prevents `cargo +<channel>` dispatch race)
        shell: bash
        run: |
          rm -f "$HOME/.cargo/bin/rustup-init" "$HOME/.cargo/bin/rustup-init.exe"
          if ! cargo --version > /dev/null 2>&1; then
            echo "ERROR: \`cargo --version\` fails — \$HOME/.cargo/bin/cargo is not a working cargo proxy."
            echo "--- ls -la \$HOME/.cargo/bin/ ---"
            ls -la "$HOME/.cargo/bin/" || true
            echo "--- file \$HOME/.cargo/bin/cargo ---"
            file "$HOME/.cargo/bin/cargo" || true
            echo "--- cargo --version output ---"
            cargo --version 2>&1 || true
            exit 1
          fi
          echo "cargo --version OK: $(cargo --version)"
          if [ -e "$HOME/.cargo/bin/rustup-init" ] || [ -e "$HOME/.cargo/bin/rustup-init.exe" ]; then
            echo "ERROR: rustup-init still present after rm."
            ls -la "$HOME/.cargo/bin/" || true
            exit 1
          fi
          echo "rustup-init absent from \$HOME/.cargo/bin (good)."

      - name: Install bpf-linker
        # m234 (2026-08-12): version pin now lives at
        # .github/env/bpf-linker.env and this step routes through the
        # composite action at .github/actions/install-bpf-linker/.
        # Bump the pin by editing the env file (one-line change);
        # every install site picks up the new value automatically.
        # The `skip_ebpf` workflow_dispatch input (m234 FR-009) gates
        # this whole job, not just this step — see the job-level
        # `if:` at the top of build-ebpf.
        uses: ./.github/actions/install-bpf-linker

      - name: Build eBPF object
        run: cargo run --package xtask -- ebpf

      - name: Upload eBPF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waybill-ebpf-object
          path: waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf
          if-no-files-found: error
          retention-days: 7

  build-linux-x86_64:
    name: Build — linux-x86_64
    needs: build-ebpf
    # When `skip_ebpf=true` the build-ebpf job is skipped; without
    # this override the linux jobs would also skip. Run whenever the
    # eBPF job either succeeded OR was intentionally skipped.
    if: ${{ !cancelled() && (needs.build-ebpf.result == 'success' || needs.build-ebpf.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Milestone 668: id-token + attestations write for SLSA provenance
    # emission via actions/attest-build-provenance (FR-001) + FR-015
    # self-verify via `gh attestation verify`. contents: read preserves
    # the top-level default explicitly.
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install stable Rust (x86_64 target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-25)
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo + cross-compiled build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ env.TARGET }}

      # See ci.yml::lint-and-test for the rationale. MUST run AFTER
      # Swatinem/rust-cache or its $CARGO_HOME/bin restore re-creates
      # rustup-init.
      - name: Remove rustup-init (prevents `cargo +stable` dispatch race)
        shell: bash
        run: |
          rm -f "$HOME/.cargo/bin/rustup-init" "$HOME/.cargo/bin/rustup-init.exe"
          if ! cargo --version > /dev/null 2>&1; then
            echo "ERROR: \`cargo --version\` fails — \$HOME/.cargo/bin/cargo is not a working cargo proxy."
            echo "--- ls -la \$HOME/.cargo/bin/ ---"
            ls -la "$HOME/.cargo/bin/" || true
            echo "--- file \$HOME/.cargo/bin/cargo ---"
            file "$HOME/.cargo/bin/cargo" || true
            echo "--- cargo --version output ---"
            cargo --version 2>&1 || true
            exit 1
          fi
          echo "cargo --version OK: $(cargo --version)"
          if [ -e "$HOME/.cargo/bin/rustup-init" ] || [ -e "$HOME/.cargo/bin/rustup-init.exe" ]; then
            echo "ERROR: rustup-init still present after rm."
            ls -la "$HOME/.cargo/bin/" || true
            exit 1
          fi
          echo "rustup-init absent from \$HOME/.cargo/bin (good)."

      # Use `cross` on both Linux targets so binaries pin a wide-compat
      # glibc baseline (~2.17/2.18) instead of whatever the
      # ubuntu-latest runner ships (currently 2.39, which breaks Debian
      # 11/12, Ubuntu 22.04, RHEL 8/9 at load time). Matches the
      # aarch64 job below.
      - name: Install cross
        run: cargo install cross --locked

      - name: Download eBPF artifact
        if: ${{ !inputs.skip_ebpf }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waybill-ebpf-object
          path: ebpf-download

      - name: Place eBPF at loader's expected path
        if: ${{ !inputs.skip_ebpf }}
        run: |
          mkdir -p waybill-ebpf/target/bpfel-unknown-none/release
          cp ebpf-download/waybill-ebpf waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf

      - name: Build userspace binary (cross)
        run: cross build --release --target "$TARGET" --package waybill

      - name: Package tarball
        run: |
          set -euo pipefail
          stage="waybill-${{ env.TAG_NAME }}-${TARGET}"
          # Lay out the tarball so the loader finds the eBPF object
          # relative to CWD at the path it already expects:
          # waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf.
          # This avoids any runtime mkdir/symlink shuffle in the wrapper
          # and eliminates the filename collision the previous design
          # had (waybill-ebpf as a sibling file vs. as a directory).
          mkdir -p "$stage/waybill-ebpf/target/bpfel-unknown-none/release"
          cp "target/${TARGET}/release/waybill" "$stage/waybill"
          # When --skip_ebpf is set the eBPF blob is absent; the tarball
          # ships without it. `waybill trace` will fail with a missing-
          # eBPF diagnostic; `waybill sbom scan` etc. work unchanged.
          if [[ -f ebpf-download/waybill-ebpf ]]; then
            cp ebpf-download/waybill-ebpf "$stage/waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf"
          fi
          cp README.md "$stage/README.md"
          if [[ -f LICENSE ]]; then cp LICENSE "$stage/LICENSE"; fi
          cat > "$stage/waybill.sh" <<'WRAPPER'
          #!/usr/bin/env bash
          # waybill wrapper for trace mode. The loader resolves the eBPF
          # object relative to CWD at
          # waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf,
          # which this tarball ships in that exact layout. The wrapper
          # just cd's into the install dir so the relative path works
          # regardless of where the user invokes it from.
          #
          # For `sbom scan`, `sbom generate`, and other non-trace
          # subcommands the loader is never invoked — `./waybill` can
          # be run directly without this wrapper.
          set -euo pipefail
          here="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          cd "$here"
          exec "$here/waybill" "$@"
          WRAPPER
          chmod +x "$stage/waybill.sh"
          tar -czf "${stage}.tar.gz" "$stage"
          ls -la "${stage}.tar.gz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waybill-${{ env.TAG_NAME }}-x86_64-unknown-linux-gnu
          path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz
          if-no-files-found: error

      # Milestone 668 FR-001 + contract workflow-step.md C-1/C-2/C-3.
      # Emit SLSA build provenance for the tarball. Wrapper delegates to
      # actions/attest@v4.2.1 which auto-generates the SLSA Provenance
      # v1.0 predicate when no predicate-type is supplied.
      - name: Emit SLSA build provenance for tarball (m668 FR-001)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz

      # Milestone 668 FR-015 + contract workflow-step.md C-4/C-5/C-6.
      # Self-verify the just-emitted attestation before publication so
      # emission bugs surface inside the same job, not at consumer time.
      # Context expressions bound via env: per C-6 (no direct ${{ }}
      # interpolation into shell blocks).
      - name: Self-verify tarball provenance (m668 FR-015)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz
          REPO_NAME: ${{ github.repository }}
        run: |
          gh attestation verify "$ARTIFACT_PATH" --repo "$REPO_NAME"

  build-linux-aarch64:
    name: Build — linux-aarch64
    needs: build-ebpf
    if: ${{ !cancelled() && (needs.build-ebpf.result == 'success' || needs.build-ebpf.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Milestone 668: id-token + attestations write for SLSA provenance
    # emission via actions/attest-build-provenance (FR-001) + FR-015
    # self-verify via `gh attestation verify`. contents: read preserves
    # the top-level default explicitly.
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      TARGET: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install stable Rust (aarch64 target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-25)
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo + cross-compiled build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ env.TARGET }}

      # See ci.yml::lint-and-test for the rationale. MUST run AFTER
      # Swatinem/rust-cache or its $CARGO_HOME/bin restore re-creates
      # rustup-init.
      - name: Remove rustup-init (prevents `cargo +stable` dispatch race)
        shell: bash
        run: |
          rm -f "$HOME/.cargo/bin/rustup-init" "$HOME/.cargo/bin/rustup-init.exe"
          if ! cargo --version > /dev/null 2>&1; then
            echo "ERROR: \`cargo --version\` fails — \$HOME/.cargo/bin/cargo is not a working cargo proxy."
            echo "--- ls -la \$HOME/.cargo/bin/ ---"
            ls -la "$HOME/.cargo/bin/" || true
            echo "--- file \$HOME/.cargo/bin/cargo ---"
            file "$HOME/.cargo/bin/cargo" || true
            echo "--- cargo --version output ---"
            cargo --version 2>&1 || true
            exit 1
          fi
          echo "cargo --version OK: $(cargo --version)"
          if [ -e "$HOME/.cargo/bin/rustup-init" ] || [ -e "$HOME/.cargo/bin/rustup-init.exe" ]; then
            echo "ERROR: rustup-init still present after rm."
            ls -la "$HOME/.cargo/bin/" || true
            exit 1
          fi
          echo "rustup-init absent from \$HOME/.cargo/bin (good)."

      - name: Install cross
        run: cargo install cross --locked

      - name: Download eBPF artifact
        if: ${{ !inputs.skip_ebpf }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waybill-ebpf-object
          path: ebpf-download

      - name: Place eBPF at loader's expected path
        if: ${{ !inputs.skip_ebpf }}
        run: |
          mkdir -p waybill-ebpf/target/bpfel-unknown-none/release
          cp ebpf-download/waybill-ebpf waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf

      - name: Build userspace binary (cross)
        run: cross build --release --target "$TARGET" --package waybill

      - name: Package tarball
        run: |
          set -euo pipefail
          stage="waybill-${{ env.TAG_NAME }}-${TARGET}"
          mkdir -p "$stage/waybill-ebpf/target/bpfel-unknown-none/release"
          cp "target/${TARGET}/release/waybill" "$stage/waybill"
          # skip_ebpf-safe (see linux-x86_64 comment).
          if [[ -f ebpf-download/waybill-ebpf ]]; then
            cp ebpf-download/waybill-ebpf "$stage/waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf"
          fi
          cp README.md "$stage/README.md"
          if [[ -f LICENSE ]]; then cp LICENSE "$stage/LICENSE"; fi
          cat > "$stage/waybill.sh" <<'WRAPPER'
          #!/usr/bin/env bash
          # Trace-mode wrapper: cd into the install dir so the loader's
          # CWD-relative eBPF path (waybill-ebpf/target/bpfel-unknown-none/release/waybill-ebpf)
          # resolves. Non-trace subcommands can call ./waybill directly.
          set -euo pipefail
          here="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          cd "$here"
          exec "$here/waybill" "$@"
          WRAPPER
          chmod +x "$stage/waybill.sh"
          tar -czf "${stage}.tar.gz" "$stage"
          ls -la "${stage}.tar.gz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waybill-${{ env.TAG_NAME }}-aarch64-unknown-linux-gnu
          path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz
          if-no-files-found: error

      # Milestone 668 FR-001 + contract workflow-step.md C-1/C-2/C-3.
      - name: Emit SLSA build provenance for tarball (m668 FR-001)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz

      # Milestone 668 FR-015 + contract workflow-step.md C-4/C-5/C-6.
      - name: Self-verify tarball provenance (m668 FR-015)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz
          REPO_NAME: ${{ github.repository }}
        run: |
          gh attestation verify "$ARTIFACT_PATH" --repo "$REPO_NAME"

  build-macos-aarch64:
    name: Build — macos-aarch64
    runs-on: macos-14
    # Milestone 668: id-token + attestations write for SLSA provenance
    # emission via actions/attest-build-provenance (FR-001) + FR-015
    # self-verify via `gh attestation verify`. contents: read preserves
    # the top-level default explicitly.
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install stable Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-25)
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ env.TARGET }}

      # See ci.yml::lint-and-test for the rationale. MUST run AFTER
      # Swatinem/rust-cache or its $CARGO_HOME/bin restore re-creates
      # rustup-init.
      - name: Remove rustup-init (prevents `cargo +stable` dispatch race)
        shell: bash
        run: |
          rm -f "$HOME/.cargo/bin/rustup-init" "$HOME/.cargo/bin/rustup-init.exe"
          if ! cargo --version > /dev/null 2>&1; then
            echo "ERROR: \`cargo --version\` fails — \$HOME/.cargo/bin/cargo is not a working cargo proxy."
            echo "--- ls -la \$HOME/.cargo/bin/ ---"
            ls -la "$HOME/.cargo/bin/" || true
            echo "--- file \$HOME/.cargo/bin/cargo ---"
            file "$HOME/.cargo/bin/cargo" || true
            echo "--- cargo --version output ---"
            cargo --version 2>&1 || true
            exit 1
          fi
          echo "cargo --version OK: $(cargo --version)"
          if [ -e "$HOME/.cargo/bin/rustup-init" ] || [ -e "$HOME/.cargo/bin/rustup-init.exe" ]; then
            echo "ERROR: rustup-init still present after rm."
            ls -la "$HOME/.cargo/bin/" || true
            exit 1
          fi
          echo "rustup-init absent from \$HOME/.cargo/bin (good)."

      - name: Build userspace binary
        run: cargo build --release --target "$TARGET" --package waybill

      - name: Package tarball
        run: |
          set -euo pipefail
          stage="waybill-${{ env.TAG_NAME }}-${TARGET}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/waybill" "$stage/waybill"
          cp README.md "$stage/README.md"
          if [[ -f LICENSE ]]; then cp LICENSE "$stage/LICENSE"; fi
          tar -czf "${stage}.tar.gz" "$stage"
          ls -la "${stage}.tar.gz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waybill-${{ env.TAG_NAME }}-aarch64-apple-darwin
          path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz
          if-no-files-found: error

      # Milestone 668 FR-001 + contract workflow-step.md C-1/C-2/C-3.
      - name: Emit SLSA build provenance for tarball (m668 FR-001)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz

      # Milestone 668 FR-015 + contract workflow-step.md C-4/C-5/C-6.
      - name: Self-verify tarball provenance (m668 FR-015)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.tar.gz
          REPO_NAME: ${{ github.repository }}
        run: |
          gh attestation verify "$ARTIFACT_PATH" --repo "$REPO_NAME"

  # Milestone 100 — Windows x86_64 release artifact. Produces a .zip
  # containing waybill.exe + README + (if present) LICENSE, matching
  # the layout of the Linux/macOS tarballs. waybill-ebpf is excluded
  # automatically via cargo's target-metadata exclusion.
  build-windows-x86_64:
    name: Build — windows-x86_64
    runs-on: windows-latest
    # Milestone 668: id-token + attestations write for SLSA provenance
    # emission via actions/attest-build-provenance (FR-001) + FR-015
    # self-verify via `gh attestation verify`. contents: read preserves
    # the top-level default explicitly.
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install stable Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-25)
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ env.TARGET }}

      # See ci.yml::lint-and-test for the rationale. MUST run AFTER
      # Swatinem/rust-cache or its $CARGO_HOME/bin restore re-creates
      # rustup-init.
      - name: Remove rustup-init (prevents `cargo +stable` dispatch race)
        shell: bash
        run: |
          rm -f "$HOME/.cargo/bin/rustup-init" "$HOME/.cargo/bin/rustup-init.exe"
          if ! cargo --version > /dev/null 2>&1; then
            echo "ERROR: \`cargo --version\` fails — \$HOME/.cargo/bin/cargo is not a working cargo proxy."
            echo "--- ls -la \$HOME/.cargo/bin/ ---"
            ls -la "$HOME/.cargo/bin/" || true
            echo "--- file \$HOME/.cargo/bin/cargo ---"
            file "$HOME/.cargo/bin/cargo" || true
            echo "--- cargo --version output ---"
            cargo --version 2>&1 || true
            exit 1
          fi
          echo "cargo --version OK: $(cargo --version)"
          if [ -e "$HOME/.cargo/bin/rustup-init" ] || [ -e "$HOME/.cargo/bin/rustup-init.exe" ]; then
            echo "ERROR: rustup-init still present after rm."
            ls -la "$HOME/.cargo/bin/" || true
            exit 1
          fi
          echo "rustup-init absent from \$HOME/.cargo/bin (good)."

      - name: Build userspace binary
        run: cargo build --release --target $env:TARGET --package waybill
        shell: pwsh

      - name: Package zip
        shell: pwsh
        env:
          REF_NAME: ${{ env.TAG_NAME }}
        run: |
          $stage = "waybill-$env:REF_NAME-$env:TARGET"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/waybill.exe" "$stage/waybill.exe"
          Copy-Item README.md "$stage/README.md"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$stage/LICENSE" }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Get-Item "$stage.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waybill-${{ env.TAG_NAME }}-x86_64-pc-windows-msvc
          path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.zip
          if-no-files-found: error

      # Milestone 668 FR-001 + contract workflow-step.md C-1/C-2/C-3.
      # Windows artifact is a .zip (not .tar.gz); actions/attest-build-
      # provenance handles either transparently — subject hashing is over
      # the file bytes regardless of container format.
      - name: Emit SLSA build provenance for zip (m668 FR-001)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.zip

      # Milestone 668 FR-015 + contract workflow-step.md C-4/C-5/C-6.
      # Windows runners default to pwsh; `gh attestation verify`'s
      # subject-path argument works either shell but we force bash for
      # env-var quoting parity with the Linux/macOS jobs (contract C-6).
      - name: Self-verify zip provenance (m668 FR-015)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: waybill-${{ env.TAG_NAME }}-${{ env.TARGET }}.zip
          REPO_NAME: ${{ github.repository }}
        run: |
          gh attestation verify "$ARTIFACT_PATH" --repo "$REPO_NAME"

  # Issue #234 — multi-arch production container image. Reuses the
  # per-arch tarballs uploaded by build-linux-x86_64 and
  # build-linux-aarch64 so the binary inside the image is byte-
  # identical to the binary in the GitHub-Releases download. The
  # image is signed with cosign keyless via Sigstore (matches the
  # project's existing attestation philosophy).
  publish-container-image:
    name: Publish multi-arch container image
    needs: [build-linux-x86_64, build-linux-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for cosign keyless OIDC token exchange.
      attestations: write # Milestone 668 FR-002: SLSA build provenance emission.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG_NAME }}
          # Kusari Inspector requirement: prevent token-in-.git/config
          # exposure to subsequent steps / artifacts. This workflow
          # doesn't push back to the repo, so persisting creds is
          # never needed.
          persist-credentials: false

      - name: Download linux-x86_64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waybill-${{ env.TAG_NAME }}-x86_64-unknown-linux-gnu
          path: ./image-context/amd64

      - name: Download linux-aarch64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waybill-${{ env.TAG_NAME }}-aarch64-unknown-linux-gnu
          path: ./image-context/arm64

      - name: Extract tarballs into per-arch staging dirs
        shell: bash
        run: |
          set -euo pipefail
          # The Dockerfile expects ./image-context/{amd64,arm64}/staging/
          # to contain the unpacked tarball's top-level directory contents.
          # The tarball top-level dir name embeds version + target, so we
          # extract then rename to the stable `staging` symlink.
          for arch in amd64 arm64; do
            cd "./image-context/${arch}"
            tarball=$(ls waybill-*.tar.gz)
            tar -xzf "$tarball"
            # The tarball contains one directory named waybill-<tag>-<target>;
            # rename it to `staging` for the Dockerfile COPY. The glob
            # `waybill-*/` (trailing slash) restricts the match to the
            # extracted directory only, excluding the tarball file itself —
            # without the trailing slash, `mv` sees both as sources and
            # errors because the `staging` destination doesn't exist yet.
            mv waybill-*/ staging
            ls -la staging/
            cd ../..
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        # Kusari Inspector requirement: NEVER interpolate ${{ ... }}
        # context expressions directly into `run:` shell blocks —
        # bind them to env: variables first to neutralize shell-
        # injection via attacker-controllable refs/branch names.
        env:
          REF_NAME: ${{ env.TAG_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ref="$REF_NAME"
          # Strip leading 'v' for the version-only tag — both forms are
          # common in the ecosystem, ship both.
          ver="${ref#v}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${REPO_OWNER}/waybill:${ref}"
            echo "ghcr.io/${REPO_OWNER}/waybill:${ver}"
            echo "ghcr.io/${REPO_OWNER}/waybill:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./image-context
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # BuildKit-emitted provenance (NOT the SLSA v1.0 predicate that
          # actions/attest-build-provenance emits below). BuildKit's
          # `mode=max` produces a build-tool-specific provenance annotation
          # attached to the image manifest — complementary to the SLSA
          # attestation, retained per research R1's alternatives-considered
          # note ("kept as-is; attest-build-provenance runs alongside").
          provenance: mode=max
          sbom: true
          # No build args needed; buildx auto-passes TARGETARCH.

      # Milestone 668 FR-002 + contract workflow-step.md C-1/C-2/C-3.
      # Emit SLSA build provenance for the OCI image using subject-digest
      # from the buildx output. push-to-registry: true attaches the
      # attestation to the image manifest via OCI referrers, broadening
      # verifier compatibility (cosign download attestation, crane, etc.)
      # in addition to `gh attestation verify`.
      - name: Emit SLSA build provenance for OCI image (m668 FR-002)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/waybill
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Milestone 668 FR-015 + contract workflow-step.md C-4/C-5/C-6.
      - name: Self-verify OCI image provenance (m668 FR-015)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/waybill@${{ steps.build.outputs.digest }}
          REPO_NAME: ${{ github.repository }}
        run: |
          gh attestation verify "oci://$IMAGE_REF" --repo "$REPO_NAME"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (Sigstore keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${OWNER}/waybill@${DIGEST}"
          echo "Signed image: ghcr.io/${OWNER}/waybill@${DIGEST}"

  release:
    name: Create GitHub release
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # Feature 229 FR-004: Sigstore keyless OIDC for --sign
      attestations: write # Milestone 668 FR-003: SLSA build provenance for source SBOM sidecar.
    steps:
      # Feature 229 US1 T004: checkout source tree so waybill can scan it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Download all tarball artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: waybill-${{ env.TAG_NAME }}-*
          path: ./artifacts
          merge-multiple: true

      - name: Move tarballs to workspace root
        run: |
          set -euo pipefail
          mv ./artifacts/*.tar.gz ./artifacts/*.zip .

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum waybill-*.tar.gz waybill-*.zip > SHA256SUMS
          cat SHA256SUMS

      # Feature 229 US1 T004 + FR-003/FR-004: generate + sign a waybill-of-waybill
      # SBOM of the source tree at the released tag. UNCONDITIONAL — no
      # tag-format branching (Q2 clarification). Fail-closed via
      # `set -euo pipefail`: any signing failure fails the workflow.
      #
      # m222 CLI surface (verified 2026-08-06 via
      # `grep -B 2 -A 3 "pub sign:" waybill-cli/src/cli/scan_cmd.rs`):
      # `--sign` is a FLAG on `sbom scan`, not a separate sub-command.
      # Uses ambient GHA OIDC token via the id-token: write permission.
      - name: Extract waybill Linux x86_64 binary
        run: |
          set -euo pipefail
          # Find the extracted tarball's `waybill` executable — the
          # tarballs unpack to `waybill-<tag>-<target>/waybill` inside.
          # Move-and-extract in a scratch dir to avoid polluting workspace.
          mkdir -p /tmp/waybill-bin
          tar -xzf "./waybill-${TAG_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C /tmp/waybill-bin --strip-components=1
          chmod +x /tmp/waybill-bin/waybill
          /tmp/waybill-bin/waybill --version

      # Feature 229 US1 T004 — cosign sign-blob path (recovery from v0.2.0
      # release attempt). `waybill sbom scan --sign` was the original design
      # per 229 §4.4, but sigstore-rs 0.11 requires an `email` OIDC claim
      # which GitHub Actions ambient tokens do NOT emit — GHA emits `sub`
      # instead (memory feedback_sigstore_rs_011_email_limitation). Workaround
      # per Q2 clarification (all releases MUST be signed): generate the SBOM
      # without --sign, then use cosign's own ambient-GHA OIDC path (which
      # accepts `sub` claim) to sign the resulting file. Byte-identical
      # verifier-facing output — `cosign verify-blob --signature <sig>
      # --certificate <cert>` works the same way. See follow-up issue for
      # tracking the sigstore-rs upstream fix.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate source-tree SBOM (waybill-of-waybill, unsigned)
        run: |
          set -euo pipefail
          /tmp/waybill-bin/waybill sbom scan \
            --path . \
            --format cyclonedx-json \
            --output waybill-source.cdx.json \
            --no-deep-hash

      # Milestone 668 FR-003 + contract workflow-step.md C-1/C-2/C-3.
      # Emit SLSA build provenance for the source-tree SBOM. Coexists
      # with the cosign sign-blob step below (contract C-8) — the two
      # signing paths are independent and both required for release.
      - name: Emit SLSA build provenance for source SBOM (m668 FR-003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: waybill-source.cdx.json

      # Milestone 668 FR-015 + contract workflow-step.md C-4/C-5/C-6.
      - name: Self-verify source SBOM provenance (m668 FR-015)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: waybill-source.cdx.json
          REPO_NAME: ${{ github.repository }}
        run: |
          gh attestation verify "$ARTIFACT_PATH" --repo "$REPO_NAME"

      - name: Sign SBOM via cosign sign-blob (Sigstore keyless, GHA ambient OIDC)
        run: |
          set -euo pipefail
          # cosign 2.6+ requires --bundle for keyless signing under the
          # active signing-config path. The bundle is a self-contained
          # JSON blob carrying both signature and certificate; consumers
          # verify via `cosign verify-blob --bundle <path> <blob>` (see
          # RELEASING.md §Step 9).
          cosign sign-blob \
            --yes \
            --bundle waybill-source.cdx.json.bundle \
            waybill-source.cdx.json
          echo "Signed SBOM at waybill-source.cdx.json"
          echo "  Bundle: waybill-source.cdx.json.bundle"

      - name: Compute prerelease flag from tag
        id: prerelease_flag
        env:
          REF_NAME: ${{ env.TAG_NAME }}
        run: |
          set -euo pipefail
          # Feature 229 US1: stable tags (bare-SemVer `v<X>.<Y>.<Z>`) are
          # full releases; anything else with a pre-release suffix is a
          # prerelease. This matters for GitHub's "Latest release" badge —
          # only full releases can be "Latest".
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable tag detected — full release"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag detected — prerelease flag set"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Issue #171: pin the release to TAG_NAME so workflow_dispatch
          # invocations (where github.ref is the dispatched-from branch,
          # not the tag) target the correct existing tag.
          tag_name: ${{ env.TAG_NAME }}
          # Feature 229 US1: dynamic prerelease flag — stables are full
          # releases, nightlies + bridges are prereleases.
          prerelease: ${{ steps.prerelease_flag.outputs.prerelease }}
          generate_release_notes: true
          # Milestone 668 FR-009 discoverability: prepend a one-line
          # verification-recipe pointer to the auto-generated notes so
          # first-time consumers know how to verify every artifact
          # this release ships. `body:` here is prepended to the
          # softprops action's auto-generated changelog (verified by
          # inspection of softprops/action-gh-release@v3 behavior).
          body: |
            ## Verify this release

            Every artifact in this release ships with a SLSA build provenance
            attestation. Verify any artifact with:

            ```bash
            gh attestation verify <artifact> --repo kusari-oss/waybill
            ```

            Full recipes (tarball / OCI image / source SBOM sidecar / mirrored
            artifact): [docs/verifying-releases.md](https://github.com/kusari-oss/waybill/blob/main/docs/verifying-releases.md).

            ---
          files: |
            waybill-*.tar.gz
            waybill-*.zip
            SHA256SUMS
            waybill-source.cdx.json
            waybill-source.cdx.json.bundle
