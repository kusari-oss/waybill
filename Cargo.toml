[workspace]
members = ["waybill-cli", "waybill-common", "xtask"]
exclude = ["waybill-ebpf"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kusari-sandbox/waybill"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Perf-parallel-deep-hash — CPU-bound data-parallel SHA-256 across
# file lists. Rayon is pure Rust, already in the transitive graph via
# sysinfo; promoting to a direct workspace dep so waybill-cli can use
# `.par_iter()` in the deep-hash paths (waybill-cli/src/scan_fs/walker.rs
# + package_db/file_hashes.rs). Preserves output determinism because
# rayon's ordered collect from an indexed source (Vec/&[T]) preserves
# input order.
rayon = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Milestone 075 — RFC 3986 URL parsing for stripping userinfo
# credentials from auto-detected git remote URLs before they get
# embedded in published SBOMs. Already pinned at 2.5.8 transitively
# (via reqwest); promotion to a direct workspace dep changes nothing
# in Cargo.lock.
url = "2"

# Milestone 222 (US2b keyless signing) — sigstore-rs 0.11.0 patch
# that exposes `pub mod keyring` + `pub use keyring::Keyring`.
# `SigningContext::new(fulcio, rekor_config, ctfe_keyring: Keyring)`
# is otherwise unreachable from external crates (Keyring lives in a
# `pub(crate) mod`), forcing callers onto `SigningContext::production()`
# which requires the `sigstore-trust-root-*` feature — that feature
# transitively pulls `aws-lc-rs` via `tough`, violating Constitution
# Principle I (Pure Rust, Zero C). See specs/222-sigstore-keyless-signing/
# research.md §R1 + docs/sigstore-trust-keys.md.
#
# Milestone 779 adds a second patch on the same fork: accept OIDC
# tokens whose signer identity lives in `sub` rather than `email`, so a
# CI runner's ambient credential can sign. Upstream requires `email`,
# rejecting workload tokens during deserialization with the unhelpful
# "Malformed JWT: claims JSON malformed". This is upstream issue
# sigstore/sigstore-rs#413 (plus #409 for the federated issuer); a fix
# exists at PR #412, approved by a maintainer in Oct 2024 and never
# merged — it has since gone conflicting. The defect is unchanged as of
# upstream v0.14.0, so the patch survives any rebase to at least that.
#
# Un-patch when the upstream PRs land + a release ships. Fork lives at
# kusari-sandbox/sigstore-rs, tag `v0.11.0-waybill-3` (rebase-on-release
# policy documented in docs/sigstore-trust-keys.md).
[patch.crates-io]
sigstore = { git = "https://github.com/kusari-sandbox/sigstore-rs.git", tag = "v0.11.0-waybill-3" }

# waybill-ebpf is built separately via xtask (different target triple)
# and is NOT a workspace member — it uses #![no_std] + nightly + bpf target
